<!DOCTYPE html>
<html lang="en">
<head>
    <title>Prioday</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/global.css?v=1.0.0">
    <link rel="stylesheet" href="css/icons/style.css?v=1.0.0">
    <link id="theme-style" rel="stylesheet" href="css/themes/dark.css?v=1.0.0">
    <script src="js/utilities/settings.js?v=1.0.0"></script>
    <script src="js/controllers/detail.js?v=1.0.0"></script>
    <script src="js/date.js?v=1.0.0"></script>
    <script src="js/detail.js?v=1.0.0"></script>
</head>
<body>
    <h1>
        <a href="index.html"><span class="icon-undo2"></span></a>
        <span id="page-title">Details</span>
        <a id="delete-button" href="index.html"><span class="icon-bin"></span></a>
    </h1>
    <section>
        <form id="check-form">
            <button>Check</button>
        </form>
        <form id="undo-form" style="display: none;">
            <button>Undo Check</button>
        </form>
        <form id="save-form" action="index.html">
            <div>
                <label htmlFor="text">Todo Name</label>
                <input class="validate" type="text" minLength="1" id="text" required/>
            </div>

            <div>
                <label htmlFor="repeat">Repeat Forever</label>
                <label class="switch">
                    <input type="checkbox" id="repeat"/>
                    <span class="slider"></span>
                </label>
            </div>
            <div id="count-div">
                <label htmlFor="count">Count</label>
                <input class="validate" type="number" id="count" min="1" placeholder="Count">
            </div>

            <div>
                <label htmlFor="frequency">Frequency - <span id="frequency-display"></span></label>
                <div class="radio-group">
                    <input type="radio" id="day" name="frequency" value="d">
                    <label for="day">Day</label>

                    <input type="radio" id="week" name="frequency" value="w">
                    <label for="week">Week</label>

                    <input type="radio" id="month" name="frequency" value="m">
                    <label for="month">Month</label>

                    <input type="radio" id="year" name="frequency" value="y">
                    <label for="year">Year</label>
                </div>
                <input class="validate" type="number" id="number" min="1" placeholder="Frequency">
            </div>

            <div id="last-done-div">
                <label htmlFor="lastDone">Last Done</label>
                <input class="validate" type="date" id="lastDone"/>
            </div>
            <button type="submit">Save Changes</button>
        </form>
    </section>
</body>
</html>
